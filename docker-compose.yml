services:
  claude-agent:
    build: .
    container_name: claude-agent
    restart: unless-stopped
    working_dir: /workspace
    stdin_open: true
    tty: true
    volumes:
      - ./workspace:/workspace
      - .claude:/home/claude/.claude
      - .claude/.claude.json:/home/claude/.claude.json
      - .config/gh:/home/claude/.config/gh